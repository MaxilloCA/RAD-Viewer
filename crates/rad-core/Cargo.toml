[package]
name = "rad-core"
version = "0.1.0"
edition = "2021"

[dependencies]
dicom-object = "=0.10.0"
dicom-pixeldata = { version = "=0.10.0", default-features = false, features = ["native"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.145"
tempfile = "=3.23.0"
